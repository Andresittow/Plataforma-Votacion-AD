# Infraestructura SOLO para desarrollo local (sin límites de recursos).
# Uso: docker compose -f docker-compose.dev.yml up -d
# El compose final con límites (deploy.resources.limits) lo hace el Rol D.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "cub kafka-ready -b kafka:29092 1 60 &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eligible_voters --partitions 3 --replication-factor 1 --config cleanup.policy=compact &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw_votes --partitions 3 --replication-factor 1 --config cleanup.policy=compact &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security_alerts --partitions 3 --replication-factor 1 &&
       echo 'Topics listos'"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
